<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.data.settings.title }}{% endif %}</title>
  <meta name='description' content='{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.data.settings.description }}{% endif %}'>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ "/favicon/favicon.ico" | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ "/favicon/favicon-32x32.svg" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/favicon/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/favicon/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/favicon/favicon-180x180.png" | relative_url }}">
  <link rel="manifest" href="{{ "/manifest.webmanifest" | relative_url }}">
  <meta name="theme-color" content="#b11f4b">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{{ page.image | absolute_url }}">

  <!-- Facebook OpenGraph -->
  <meta property="og:title" content="{% if page.url == "/" %}{{ site.data.settings.title }}{% else %}{{ page.title }} – {{ site.data.settings.title }}{% endif %}">
  <meta property="og:description" content="{% if page.url == "/" %}{{ site.data.settings.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="image" property="og:image" content="{{ page.image | absolute_url }}">

  {% include google-analytics.html %}
  <script>
    const colorScheme = "{{ site.data.settings.color_scheme }}";
    const requestedTheme = new URLSearchParams(window.location.search).get("scoutTheme");
    let savedTheme;
    try {
      savedTheme = window.localStorage.getItem("theme");
    } catch (error) {
      console.warn("Unable to read the saved theme preference.", error);
    }
    const preferredTheme = savedTheme === "light" || savedTheme === "dark"
      ? savedTheme
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const theme = requestedTheme === "light" || requestedTheme === "dark"
      ? requestedTheme
      : colorScheme === "auto"
        ? preferredTheme
        : colorScheme;

    if (theme === "dark") {
      document.documentElement.setAttribute("dark", "");
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.removeAttribute("dark");
      document.documentElement.classList.remove('dark-mode');
      if (colorScheme === "light" && requestedTheme !== "dark") {
        document.documentElement.setAttribute("light", "");
        document.documentElement.classList.add('light-mode');
      }
    }
  </script>

  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
